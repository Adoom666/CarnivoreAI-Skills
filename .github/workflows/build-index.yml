# build, review, sign and publish the catalog index.
#
# FOUR JOBS BECAUSE THERE ARE FOUR DIFFERENT TRUST LEVELS, not because it
# reads tidily. verify touches no cloud account at all and runs on every pull
# request from anyone. review holds a model api key. sign holds the index
# signing key and holds nothing else, so the blast radius of that secret is
# one job with four steps. deploy holds neither and only ships bytes the sign
# job already proved.
#
# NEVER pull_request_target. it would run this file's code with a token and an
# id-token permission against a fork's branch, which is the standard way a
# public repository gives its secrets away.
#
# EVERY uses: IS PINNED TO A COMMIT SHA with the version in a comment. a tag
# is a mutable pointer; a supply chain that trusts one trusts whoever can move
# it.
#
# JOBS THAT CANNOT RUN SAY SO. a missing repository variable or an absent
# secret prints a ::notice:: naming exactly what was missing and the job
# stands down. it never fails, so nobody learns to ignore a red build, and it
# never fakes a result, so nothing unsigned is ever deployed.

name: build index

on:
  push:
    branches:
      - main
    paths:
      - skills/**
      - releases/**
      - publishers/**
      - revocations/**
      - catalog.yml
      - tools/**
      - .github/workflows/build-index.yml
  pull_request:
    branches:
      - main
  schedule:
    # the weekly re-sign. an index signed no more than seven days ago bounds
    # an undetected key compromise to a week rather than to forever.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # one build at a time, and a queued one is never cancelled. two runs racing
  # would both read the same live serial and both publish it.
  group: catalog-index
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  inputs:
    # this job ALWAYS runs. the three cloud jobs below are skipped by an if:
    # condition, and a skipped job prints nothing at all, so without this one a
    # pipeline that published nothing would look exactly like one that did.
    name: report the inputs
    runs-on: ubuntu-latest
    steps:
      - name: say which inputs are present
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::notice::AWS_ROLE_ARN is not set, so the review, sign and deploy jobs are skipped and nothing is published"
          else
            echo "::notice::AWS_ROLE_ARN is set, so the review, sign and deploy jobs will run"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::this is a pull request, so only the verify job runs; nothing is signed or deployed from a pull request"
          fi

  verify:
    name: verify and assemble
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, because every release statement names a commit
          # and the build re-digests that commit's tree. a shallow clone would
          # refuse every release for a reason that reads like a bad signature.
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install the builder's dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: prove the digest implementation against the shared vectors
        # the product repo runs the same vectors against its own digest code.
        # if the two ever drift, both builds go red on the same afternoon.
        run: python -m pytest -q tools/tests
        working-directory: ${{ github.workspace }}

      - name: refuse a skill change with no release
        if: github.event_name == 'pull_request'
        run: |
          python -m index_builder --repo-root "$GITHUB_WORKSPACE" gate \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

      - name: assemble the unsigned index
        run: |
          python -m index_builder --repo-root "$GITHUB_WORKSPACE" assemble \
            --out "$GITHUB_WORKSPACE/index.unsigned.json" \
            --catalog-url "${{ vars.CATALOG_URL }}" \
            --live-out "$GITHUB_WORKSPACE/live-index.json"
        working-directory: tools

      - name: show what was assembled
        run: |
          python - <<'PY'
          import json
          with open("index.unsigned.json", encoding="utf-8") as handle:
              document = json.load(handle)
          print("serial:", document["serial"])
          print("generated_at:", document["generated_at"])
          print("publishers:", ", ".join(document["publishers"]) or "none")
          print("items:", len(document["items"]))
          PY

      - name: keep the unsigned index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-unsigned
          path: |
            index.unsigned.json
            live-index.json
          if-no-files-found: error
          retention-days: 7

  review:
    name: security review
    needs: verify
    if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install the builder's dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: take the unsigned index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-unsigned

      - name: assume the catalog build role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: carnivore-catalog-review

      - name: write every version's review
        env:
          OPENROUTER_SECRET_ID: ${{ vars.OPENROUTER_SECRET_ID }}
        run: |
          # TRACING STAYS OFF IN THIS STEP. the secret is read into a shell
          # variable and handed straight to one process; it is never echoed,
          # never written to a file and never put on a command line, where the
          # process table would carry it.
          set +x
          set -u
          secret_id="${OPENROUTER_SECRET_ID:-carnivore/catalog/openrouter-api-key}"
          if value="$(aws secretsmanager get-secret-value \
                        --secret-id "$secret_id" \
                        --query SecretString --output text 2>/dev/null)"; then
            echo "::notice::read the review key from the secret $secret_id"
          else
            value=""
            echo "::notice::no readable secret at $secret_id, so every version is recorded with review status unavailable"
          fi
          OPENROUTER_SECRET_VALUE="$value" python -m index_builder \
            --repo-root "$GITHUB_WORKSPACE" review \
            --index "$GITHUB_WORKSPACE/index.unsigned.json" \
            --out "$GITHUB_WORKSPACE/index.json" \
            --live-index "$GITHUB_WORKSPACE/live-index.json"
        working-directory: tools

      - name: keep the reviewed index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-reviewed
          path: index.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: sign the index
    needs: review
    if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.minisign.outputs.signed }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install the builder's dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      - name: take the reviewed index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-reviewed

      - name: assume the catalog build role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: carnivore-catalog-sign

      - name: sign it, or say why it was not signed
        id: minisign
        run: |
          # TRACING STAYS OFF IN THIS STEP, for the reason on the review job.
          set +x
          set -u
          if value="$(aws secretsmanager get-secret-value \
                        --secret-id carnivore/catalog/index-signing-key \
                        --query SecretString --output text 2>/dev/null)"; then
            echo "::notice::read the index signing key from secrets manager"
          else
            value=""
            echo "::notice::there is no readable carnivore/catalog/index-signing-key secret, so this index is assembled but not signed and will not be deployed"
          fi
          INDEX_SIGNING_SECRET_VALUE="$value" python -m index_builder \
            --repo-root "$GITHUB_WORKSPACE" sign \
            --index "$GITHUB_WORKSPACE/index.json"
        working-directory: tools

      - name: keep the signed index
        if: steps.minisign.outputs.signed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index-signed
          path: |
            index.json
            index.json.minisig
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy to amplify
    needs: sign
    if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != '' && needs.sign.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: take the signed index
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index-signed
          path: signed

      - name: build the deployment zip
        run: |
          set -euo pipefail
          # customHttp.yml and index.html sit at the ROOT of the artifact, not
          # one folder down. amplify reads the header file from the top of what
          # was uploaded, and a zip with an enclosing directory silently
          # publishes no headers at all.
          rm -rf deploy
          mkdir -p deploy/v1
          cp signed/index.json deploy/v1/index.json
          cp signed/index.json.minisig deploy/v1/index.json.minisig
          cp site/customHttp.yml deploy/customHttp.yml
          cp site/index.html deploy/index.html
          (cd deploy && zip -r -q ../deploy.zip .)
          unzip -l deploy.zip

      - name: assume the catalog build role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: carnivore-catalog-deploy

      - name: upload and start the deployment
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          created="$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH")"
          job_id="$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["jobId"])')"
          upload_url="$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["zipUploadUrl"])')"
          # the presigned url is a credential in a query string, so it is never
          # echoed. only the job id goes to the log.
          echo "::notice::amplify deployment job $job_id"
          curl --fail --silent --show-error -X PUT \
            -H 'Content-Type: application/zip' \
            --upload-file deploy.zip "$upload_url"
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$job_id" > /dev/null
          echo "AMPLIFY_JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: wait for the deployment to finish
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$AMPLIFY_JOB_ID" \
              --query 'job.summary.status' --output text)"
            echo "attempt $attempt: $status"
            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) echo "::error::amplify job $AMPLIFY_JOB_ID ended $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::amplify job $AMPLIFY_JOB_ID did not finish within five minutes"
          exit 1

      - name: prove the published headers
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          set -uo pipefail
          # the custom domain may not be live yet, so the default amplify
          # domain is the fallback and the log SAYS which one was checked. a
          # check that quietly measured a different host is worth nothing.
          url="$CATALOG_URL"
          if ! curl --fail --silent --head --max-time 20 "$url" > headers.txt; then
            url="https://${AMPLIFY_BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com/v1/index.json"
            echo "::notice::the custom domain did not answer, so the headers were checked on the default amplify domain instead: $url"
            curl --fail --silent --head --max-time 20 "$url" > headers.txt
          fi
          echo "checked: $url"
          cat headers.txt
          if grep -iq 'cache-control: *public, max-age=300, must-revalidate' headers.txt; then
            echo "cache-control is the one customHttp.yml asks for"
          else
            echo "::error::$url did not answer the cache-control header customHttp.yml sets"
            exit 1
          fi
          grep -iq 'x-content-type-options: *nosniff' headers.txt \
            || { echo "::error::$url did not answer x-content-type-options: nosniff"; exit 1; }
